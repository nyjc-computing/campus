                    type: string
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: NOT_FOUND
                  message: Key not found
                  request_id: req_bb922g

    post:
      summary: Set vault value
      description: Set a specific key in a vault
      tags:
        - Vaults
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
