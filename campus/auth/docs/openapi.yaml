              schema:
                type: object

  /auth/v1/root/:
    post:
      summary: Authenticate service
      description: |
        Authenticate a service client using token or client credentials.
        **WARNING: For internal backend use only.**
      tags:
        - Internal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: OAuth token for authentication
                client_id:
                  type: string
                  description: Client ID for client credential auth
                client_secret:
                  type: string
                  description: Client secret for client credential auth
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    type: object
                  user:
                    type: object
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: AUTH_INVALID_REQUEST
                  message: Missing authentication credentials.
                  request_id: req_ff926k
        '401':
          description: Invalid credentials (unknown client or token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: AUTH_INVALID_CLIENT
                  message: Invalid client credentials.
                  request_id: req_42a91c
