openapi: 3.0.3
info:
  title: Campus Auth API
  description: |
    Campus OAuth 2.0 Authorization Server and Authentication API.

    All routes are served under the `/auth/v1` prefix; paths in this
    document are written with that prefix included.

    For the narrative end-to-end browser login flow (session creation,
    Google Workspace leg, code exchange) see
    [docs/auth-login-flow.md](../../../../docs/auth-login-flow.md) —
    this file documents the same endpoints at schema level.

    ## Error Responses

    All error responses follow the Campus error envelope format while maintaining
    OAuth 2.0 compliance (RFC 6749).

    OAuth-specific details are included in the `details.oauth_error` field.

    Reference: [auth-error-spec.md](./auth-error-spec.md)
  version: 0.1.0
  contact:
    name: NYJC Computing
    email: nyjc.computing@nyjc.edu.sg

servers:
  - url: https://auth.campus.nyjc.app
    description: Production
  - url: https://auth.campus.nyjc.dev
    description: Staging
  - url: https://campusauth-development.up.railway.app
    description: Development

components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/AuthError'

    AuthError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Campus error code (AUTH_* prefix)
          example: AUTH_INVALID_CLIENT
        message:
          type: string
          description: Human-readable error message
        request_id:
          type: string
          nullable: true
          description: Request correlation ID for tracing
        details:
          type: object
          description: Additional error details including OAuth protocol fields
          properties:
            oauth_error:
              type: string
              description: RFC 6749 OAuth error string
              example: invalid_client
            oauth_error_description:
              type: string
              description: OAuth error description
            required_scopes:
              type: array
              items:
                type: string
              description: Required scopes for insufficient_scope errors

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, errors]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            request_id:
              type: string
              nullable: true
            errors:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string

    User:
      type: object
      required: [id, email, name, created_at, updated_at]
      properties:
        id:
          type: string
          example: usr_123abc
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: John Doe
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Client:
      type: object
      required: [id, client_id, client_secret]
      properties:
        id:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        allowed_scopes:
          type: array
          items:
            type: string
          description: >
            Fail-closed scope allowlist: the only scopes this client may
            be granted on Campus tokens (docs/auth-token-invariants.md A1).
        upstream_scopes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >
            Per-provider allowlist of upstream (third-party) scopes the
            client may be granted through the OAuth proxies; an absent
            provider entry allows only that proxy's base scopes
            (docs/auth-token-invariants.md B3).

    LoginSession:
      type: object
      required: [id, user_id, created_at, expires_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      description: |
        A Campus authorization session (RFC 6749 authorization-code
        pending state). Created by the client backend via
        POST /auth/v1/sessions/campus/; the `id` doubles as the OAuth
        `state` for /auth/v1/authorize. See docs/auth-login-flow.md.
      required: [id, provider, client_id, redirect_uri]
      properties:
        id:
          type: string
          description: Session id; used as the OAuth state parameter
          example: campus_session_d2fc0db51093418f
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Session TTL is 10 minutes by default
        provider:
          type: string
          description: Session provider namespace (campus for the login flow)
          enum: [campus, google, github, discord]
        client_id:
          type: string
          example: uid-client-cfaf0e29
        user_id:
          type: string
          nullable: true
          description: Bound by verify_login after Google authentication
        redirect_uri:
          type: string
          description: Exact registered URI the authorization code is delivered to
        scopes:
          type: array
          items:
            type: string
        authorization_code:
          type: string
          nullable: true
          description: Pre-generated code; overwritten with INVALIDATED once used
        state:
          type: string
          nullable: true
          description: Defaults to the session id
        target:
          type: string
          nullable: true
          description: Final post-login destination returned by session finalize

    TokenResponse:
      type: object
      description: |
        Campus OAuth token issued by POST /auth/v1/token
        (authorization_code grant). Field names deviate from RFC 6749:
        the access token string is carried in `id` and granted scopes
        are the space-delimited `scope` string (#648/#650).
      required: [id, expires_at, expires_in, token_type, scope]
      properties:
        id:
          type: string
          description: Access token string (RFC name access_token on input only)
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          description: Access token lifetime in seconds (default 7 days)
        token_type:
          type: string
          enum: [Bearer]
        refresh_token:
          type: string
          nullable: true
          description: Rotated on every refresh grant; single-use (#678)
        refresh_token_expires_at:
          type: string
          format: date-time
          nullable: true
        scope:
          type: string
          description: Space-delimited granted scopes
        user_id:
          type: string
          description: |
            Authorized user echoed from the auth session so confidential
            clients can display login state without a second lookup (#696)

    Credentials:
      type: object
      required: [token, client_id, user_id, scopes, expiry]
      properties:
        token:
          type: string
        client_id:
          type: string
        user_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiry:
          type: string
          format: date-time

    VaultKey:
      type: string
      description: A key in a vault (encrypted value)

  responses:
    InvalidRequest:
      description: Invalid request, rejected without redirecting (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_INVALID_REQUEST
              message: redirect_uri is not registered for this client
              request_id: req_ff926k
              details:
                oauth_error: invalid_request

    InvalidClient:
      description: Client authentication failed (401)
      headers:
        WWW-Authenticate:
          description: Bearer authentication scheme with error details
          schema:
            type: string
            example: 'Bearer error="invalid_client", error_description="Client authentication failed"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_INVALID_CLIENT
              message: Client authentication failed
              request_id: req_42a91c
              details:
                oauth_error: invalid_client

    InvalidGrant:
      description: Invalid or expired authorization grant (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_INVALID_GRANT
              message: Invalid credentials
              request_id: req_d81b0f
              details:
                oauth_error: invalid_grant

    UnauthorizedClient:
      description: Client not authorized for this grant type (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_UNAUTHORIZED_CLIENT
              message: Client not authorized
              request_id: req_aa921f
              details:
                oauth_error: unauthorized_client

    InsufficientScope:
      description: Token lacks required scope (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_INSUFFICIENT_SCOPE
              message: Insufficient permissions
              request_id: req_bb922g
              details:
                oauth_error: insufficient_scope
                required_scopes: [campus.read]

    ValidationError:
      description: Request validation failed (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields are invalid
              request_id: req_cc923h
              errors:
                - field: username
                  code: MISSING
                  message: Username is required
                - field: password
                  code: MISSING
                  message: Password is required

    NotFound:
      description: Resource not found (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
              request_id: req_dd924i

    Conflict:
      description: Resource conflict (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: Resource already exists
              request_id: req_ee925j

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
      description: Session provider namespace (campus for the login flow)
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Authorization session id

paths:
  /auth/v1/users/:
    get:
      summary: List all users
      description: Get all Campus users
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '403':
          $ref: '#/components/responses/UnauthorizedClient'

    post:
      summary: Create a new user
      description: Create a new Campus user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/v1/users/{user_id}/:
    get:
      summary: Get user details
      description: Get details of a specific user
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      summary: Update a user
      description: Update user details (not yet implemented)
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '501':
          description: Not implemented

    delete:
      summary: Delete a user
      description: Delete a user
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/v1/users/{user_id}/activate:
    post:
      summary: Activate a user
      description: Activate a user account
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/v1/logins/:
    post:
      summary: Create login session
      description: Create a new login session with email/password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/v1/sessions/{provider}/:
    post:
      summary: Create an authorization session
      description: |
        Create a Campus authorization session (step 1 of the
        authorization-code flow). Authenticated with the client's own
        credentials (HTTP Basic, or a Bearer Campus token). The session
        `id` in the response is used as the OAuth `state` for
        /auth/v1/authorize. Requires a trailing slash.
      tags:
        - OAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [campus, google, github, discord]
          description: Session provider namespace; use campus for the login flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri]
              properties:
                client_id:
                  type: string
                  description: The OAuth client requesting authorization
                redirect_uri:
                  type: string
                  format: uri
                  description: Must be registered on the client (fail-closed, #685)
                scopes:
                  type: array
                  items:
                    type: string
                user_id:
                  type: string
                  nullable: true
                target:
                  type: string
                  format: uri
                  nullable: true
                  description: Final post-login destination (returned by finalize)
                state:
                  type: string
                  nullable: true
                  description: Defaults to the session id
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/v1/sessions/{provider}/authorization_code:
    post:
      summary: Look up a session by authorization code
      description: |
        Resolve an authorization code to its session. Requires a
        trailing-slash-free path as written.
      tags:
        - OAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Session for the given code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'

  /auth/v1/sessions/{provider}/{session_id}/:
    get:
      summary: Get an authorization session
      tags:
        - OAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an authorization session
      description: |
        Only `user_id` and `authorization_code` can be updated; both are
        normally set by verify_login after Google authentication.
      tags:
        - OAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                authorization_code:
                  type: string
      responses:
        '200':
          description: Update applied
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Finalize (delete) an authorization session
      description: |
        Deletes the session and returns the `target` URL the client
        should land the browser on (step 6 of the login flow).
      tags:
        - OAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/v1/authorize:
    get:
      summary: Authorization endpoint (RFC 6749 §4.1.1)
      description: |
        Browser-facing authorization endpoint (campus/auth/provider.py).
        Validates the request, then redirects the browser through the
        Google Workspace login leg; verify_login eventually delivers the
        authorization code to the session's redirect_uri. The `state`
        parameter must be a campus session id created via
        POST /auth/v1/sessions/campus/.

        redirect_uri is validated fail-closed (exact match against the
        client's registered redirect_uris; clients with no registered
        URIs are rejected). Rejections return 400 without redirecting
        (RFC 6749 §4.1.2.1, #651/#685).
      tags:
        - OAuth
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Campus auth session id (from POST /auth/v1/sessions/campus/)
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Not yet enforced; the session's scopes are granted
        - name: hd
          in: query
          required: false
          schema:
            type: string
          description: Hosted domain hint passed through to Google
      responses:
        '302':
          description: Redirect to the Google login leg (google/authorize)
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'

  /auth/v1/verify_login:
    get:
      summary: Post-login callback that issues the authorization code
      description: |
        Internal browser-flow leg (target of the Google redirect).
        Requires the campus login cookie set by google/callback.
        Provisions the user record, binds user_id and a fresh
        authorization code onto the session identified by `state`, and
        redirects the browser to the session's redirect_uri with
        code, state and scope query parameters.
      tags:
        - OAuth
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Campus auth session id
      responses:
        '302':
          description: Redirect to the client redirect_uri with the code
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: No campus login cookie / no valid Google credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/v1/token:
    post:
      summary: Token endpoint — authorization_code grant
      description: |
        Exchanges an authorization code for a Campus token
        (campus/auth/provider.py). Confidential clients must present
        their client_secret; the code is single-use (overwritten with
        INVALIDATED on first use). Accepts JSON or
        application/x-www-form-urlencoded.

        Do not confuse with /auth/v1/oauth/token (device_code and
        refresh_token grants).
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, code, redirect_uri, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                  description: Must match the authorization request
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token issued (or existing unexpired token reused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'

  /auth/v1/oauth/token:
    post:
      summary: Token endpoint — device_code and refresh_token grants
      description: |
        Handles RFC 8628 device_code and RFC 6749 refresh_token grants
        for public/confidential clients (campus/auth/routes/oauth.py).
        The authorization_code grant is deliberately NOT handled here.
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [urn:ietf:params:oauth:grant-type:device_code, refresh_token]
                client_id:
                  type: string
                device_code:
                  type: string
                  description: Required for the device_code grant
                refresh_token:
                  type: string
                  description: Required for the refresh_token grant
      responses:
        '200':
          description: Token issued; refresh grants rotate the pair (single-use)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '403':
          $ref: '#/components/responses/UnauthorizedClient'

  /auth/v1/oauth/revoke:
    post:
      summary: Revoke an access or refresh token (RFC 7009)
      description: |
        Returns 200 regardless of whether the token was found, was
        already revoked, or belongs to another client (#677).
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token:
                  type: string
                client_id:
                  type: string
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
      responses:
        '200':
          description: Revocation processed (or token unknown)
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /auth/v1/clients/:
    post:
      summary: Register OAuth client
      description: Register a new OAuth client application
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                allowed_scopes:
                  type: array
                  items:
                    type: string
                  description: Scope allowlist requested at registration.
                upstream_scopes:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  description: Upstream provider scope allowlist requested at registration.
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '409':
          description: Client already exists
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/v1/credentials/{provider}/:
    get:
      summary: Get credentials
      description: |
        Get credentials for a specific token, or list all credentials
        for a provider.
      tags:
        - Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: token_id
          in: query
          schema:
            type: string
          description: Specific token ID (optional)
          required: false
      responses:
        '200':
          description: Credentials retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    type: object
                    description: Single credential if token_id is specified
                  credentials:
                    type: array
                    items:
                      type: object
                    description: List of all credentials if token_id is not specified
        '401':
          $ref: '#/components/responses/InvalidClient'

  /auth/v1/credentials/{provider}/{user_id}:
    get:
      summary: Get user credentials
      description: Get credentials for a specific provider and user ID
      tags:
        - Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credentials retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Issue new credentials
      description: Issue new credentials for a specific provider and user ID
      tags:
        - Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items:
                    type: string
                expiry_seconds:
                  type: integer
      responses:
        '201':
          description: Credentials issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'

    patch:
      summary: Update credentials
      description: Update credentials for a specific provider and user ID
      tags:
        - Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: object
      responses:
        '200':
          description: Credentials updated
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete credentials
      description: Delete credentials for a specific provider and user ID
      tags:
        - Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credentials deleted
          content:
            application/json:
              schema:
                type: object

  /auth/v1/vaults/{label}/:
