        - Vaults
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vault keys retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: string

  /auth/v1/vaults/{label}/{key}:
    get:
      summary: Get vault value
      description: Get a specific key from a vault
      tags:
        - Vaults
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
