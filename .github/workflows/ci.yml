name: CI

# Deliberately NO paths-ignore on these triggers: the `weekly` ruleset
# requires the Sanity/Unit matrix checks to be *reported* on every PR,
# and a workflow skipped by paths-ignore never runs — the required
# checks sit on "Expected — waiting for status to be reported" forever,
# which made docs-only PRs unmergeable (#706). Docs-only change sets are
# no-opped by the `changes` job plus per-step gating below instead.
#
# Deliberately NO branches filter on pull_request either: stacked PRs
# (base = the branch of the PR below them, the #755 worktree-SOP way of
# merging series) must get CI on every link — a base filter left stacked
# links with no checks at all (#733 Phase 2: three stacked PRs could only
# be validated by a local union run). A PR run builds head ⊕ base, which
# for a stacked link is exactly the content that reaches `weekly` when
# that link merges, so per-link runs are the correct validation point.
# The `changes` job + step gating keep docs-only links cheap, and PR
# events fire on head updates only — pushes to a base branch cannot loop
# CI. The weekly ruleset is unaffected: it only applies to PRs targeting
# `weekly`, whose checks were already being reported.
on:
  push:
    branches: [main, staging, weekly]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  ENV: testing
  UNIT_TEST_TIMEOUT: 60
  CONTRACT_TEST_TIMEOUT: 60
  INTEGRATION_TEST_TIMEOUT: 300

# A new push to an open PR supersedes (cancels) its in-flight run.
# Push runs — weekly is the release/deploy gate — are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage -1: change detection. The workflow must ALWAYS run — the
  # `weekly` ruleset requires the Sanity/Unit matrix checks to be
  # *reported* on every PR, and a workflow skipped via `paths-ignore`
  # reports nothing, leaving the required checks stuck on "Expected —
  # waiting for status to be reported" forever (observed on docs-only
  # PR #706).
  #
  # The output is `code` — "did ANY changed file fall outside
  # docs/markdown?" — because paths-filter matches with OR semantics:
  # a `docs_only` filter that lists doc patterns is true whenever a PR
  # touches at least one doc, which misclassified every code PR that
  # also edits docs (all of the #705 stack). Docs-only change sets are
  # handled by STEP-level gating below rather than job-level `if:`
  # skipping: a skipped matrix job reports a single check run with the
  # literal un-expanded name
  # (`Sanity Check (${{ matrix.python-version }})`), which can never
  # match the ruleset's per-leg required names. Jobs that run and
  # no-op report their real expanded names as green.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify change set
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!*.md'
              - '!docs/**'

  # Stage 0: style. Cheapest signal (no install needed) and the most common
  # failure class, so it gates everything else.
  ruff:
    name: Ruff
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping ruff (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Config lives in pyproject.toml [tool.ruff]; the repo must stay green
      # under `ruff check .`. Ruff is a dev dependency (poetry.lock pins it);
      # the action pins the same version so CI and `poetry run ruff` agree.
      - name: Run ruff
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'

  # Stage 1: structural gates — sanity (imports/config/startup) and pyright,
  # in parallel. Each suite job shares a venv cache keyed on poetry.lock.
  sanity-check:
    name: Sanity Check (${{ matrix.python-version }})
    needs: [changes, ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Python support tiers: 3.11-3.13 are security-status releases —
    # officially supported; the `weekly` ruleset requires their check-run
    # names verbatim ("Sanity Check (3.11)", "Unit Tests (3.11)", ...).
    # Renaming a job or editing python-version strands the ruleset: the
    # required names stop being reported and every PR blocks. Update the
    # ruleset in the same PR as any rename or security-tier matrix change.
    # 3.14 is bugfix-status (unofficial "eventually"): its legs run for
    # signal but never block, and their check names must never enter the
    # ruleset.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping sanity suite (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache (~/.cache/pip) for the pipx Poetry install — warm
          # runs skip the network fetch (#718). cache-dependency-path is
          # explicit: the repo has no requirements.txt to autodetect.
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Cache virtualenv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-poetry
      - name: Install Campus Suite
        if: needs.changes.outputs.code == 'true'
        run: poetry install --no-root
      - name: Run Sanity Checks
        if: needs.changes.outputs.code == 'true'
        run: poetry run python tests/run_tests.py sanity

  type-check:
    name: Type Check (${{ matrix.python-version }})
    needs: [changes, ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Bugfix-tier leg: 3.14 runs for signal but never blocks (see sanity-check).
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping type suite (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache (~/.cache/pip) for the pipx Poetry install — warm
          # runs skip the network fetch (#718). cache-dependency-path is
          # explicit: the repo has no requirements.txt to autodetect.
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Cache virtualenv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-poetry
      - name: Install Campus Suite
        if: needs.changes.outputs.code == 'true'
        run: poetry install --no-root
      - name: Run Type Checks
        if: needs.changes.outputs.code == 'true'
        run: poetry run python tests/run_tests.py type

  # Stage 2: component behavior. Runs only when the structural gates pass.
  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    needs: [changes, sanity-check, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Bugfix-tier leg: 3.14 runs for signal but never blocks (see sanity-check).
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping unit suite (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache (~/.cache/pip) for the pipx Poetry install — warm
          # runs skip the network fetch (#718). cache-dependency-path is
          # explicit: the repo has no requirements.txt to autodetect.
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Cache virtualenv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-poetry
      - name: Install Campus Suite
        if: needs.changes.outputs.code == 'true'
        run: poetry install --no-root
      - name: Run Unit Tests
        if: needs.changes.outputs.code == 'true'
        run: poetry run python tests/run_tests.py unit --timeout ${{ env.UNIT_TEST_TIMEOUT }}

  # Stage 3: HTTP contracts. Pointless to exercise routes if components fail.
  contract-tests:
    name: Contract Tests (${{ matrix.python-version }})
    needs: [changes, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Bugfix-tier leg: 3.14 runs for signal but never blocks (see sanity-check).
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping contract suite (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache (~/.cache/pip) for the pipx Poetry install — warm
          # runs skip the network fetch (#718). cache-dependency-path is
          # explicit: the repo has no requirements.txt to autodetect.
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Cache virtualenv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-poetry
      - name: Install Campus Suite
        if: needs.changes.outputs.code == 'true'
        run: poetry install --no-root
      - name: Run Contract Tests
        if: needs.changes.outputs.code == 'true'
        run: poetry run python tests/run_tests.py contract --timeout ${{ env.CONTRACT_TEST_TIMEOUT }}

  # Stage 4: full cross-service stack. Last — assembles every service and is
  # pointless if contracts already fail. Non-blocking on weekly, as before.
  integration-tests:
    name: Integration Tests (${{ matrix.python-version }})
    needs: [changes, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Non-blocking on the weekly release gate and for the bugfix-tier 3.14 leg.
    continue-on-error: ${{ matrix.python-version == '3.14' || github.base_ref == 'weekly' || (github.event_name == 'push' && github.ref_name == 'weekly') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Docs-only fast exit
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change set: skipping integration suite (no-op run to report checks)."
          fi
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache (~/.cache/pip) for the pipx Poetry install — warm
          # runs skip the network fetch (#718). cache-dependency-path is
          # explicit: the repo has no requirements.txt to autodetect.
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Cache virtualenv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-poetry
      - name: Install Campus Suite
        if: needs.changes.outputs.code == 'true'
        run: poetry install --no-root
      - name: Run Integration Tests (required for staging/main, optional for weekly)
        if: needs.changes.outputs.code == 'true'
        run: poetry run python tests/run_tests.py integration --timeout ${{ env.INTEGRATION_TEST_TIMEOUT }}
