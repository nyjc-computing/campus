name: Lint

on:
  push:
    branches: [main, staging, weekly]
  pull_request:
    branches: [main, staging, weekly]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Config lives in pyproject.toml [tool.ruff]; the repo must stay green
      # under `ruff check .` (pinned in dev deps once the lockfile next
      # regenerates - see PR adopting ruff).
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'
