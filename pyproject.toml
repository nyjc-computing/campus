# Campus - Deployment Orchestrator & Client Library
# This configuration supports deployment orchestration and client library distribution
# Deployment mode determined by 'deploy' file content

[tool.poetry]
name = "campus-suite"
version = "0.1.16"
description = "Campus Suite - Complete education management platform deployment orchestrator and client library"
authors = ["Ng Jun Siang <ngjunsiang@gmail.com>"]
readme = "README.md"
packages = [{include = "campus"}]

[tool.poetry.dependencies]
# Python support tiers (python.org release status):
# - security (3.11-3.13): officially supported; CI-required.
# - bugfix (3.14): unofficial ("not yet but eventually"); CI-tested with
#   failures allowed; never deployed to prod.
python = ">=3.11.0,<3.15"

# Campus internal dependencies
campus-api-python = {git = "https://github.com/nyjc-computing/campus-api-python.git", branch = "main"}

# Client library dependencies (minimal for HTTP requests)
bcrypt = "^5.0.0"
flask = "^3.0.0"
requests = "^2.32.4"
psycopg2-binary = "^2.9.0"
pymongo = {extras = ["srv"], version = "^4.13.2"}
boto3 = "^1.35.0"

# Deployment orchestration dependencies (all services) - required for deployment
gunicorn = "^26.2.0"
werkzeug = "^3.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.9"
pyright = "^1.1.391"
openapi-spec-validator = "^0.7.2"
boto3-stubs = "^1.42.57"

[tool.poetry.scripts]
campus = "main:main"

[tool.pyright]
useLibraryCodeForTypes = true
extraPaths = ["."]
venvPath = "."
venv = ".venv"
exclude = [".cache", ".venv/Lib/site-packages/campus_python", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
reportIncompatibleMethodOverride = "none"
stubPath = ""

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# ARG omitted: unused-argument flags Campus's signature-contract pattern
# (route handlers bound by unpack_request, interface-conform resource
# methods) repo-wide; revisit if the routing layer changes.
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'SIM']
# Policy (2026-09-30): ruff enforces style; humans rewrite code. Autofixes
# are disabled repo-wide because they are semantics-preserving only for
# common types - e.g. SIM118 rewrote `for k in sqlite_row.keys():` into
# direct iteration, which is correct for dict but breaks sqlite3.Row
# (iterating it yields values, not column names). Use `ruff check --diff`
# to review suggested rewrites, then apply them deliberately per site.
fixable = []
ignore = [
    'W291', 'W292', 'W293',  # trailing whitespace: formatting, not lint
]

[tool.ruff.lint.per-file-ignores]
# Legacy one-off scripts predating the campus package (the `apps` module no
# longer exists); kept for history, not executed.
"migrations/*" = ['F821']
# scripts/ bootstraps sys.path before importing campus - intentional.
"scripts/*" = ['E402']
# Device-verification route embeds a full HTML/CSS/JS template as a string
# literal; wrapping template lines churns served HTML for no gain.
"campus/auth/routes/oauth.py" = ['E501']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
